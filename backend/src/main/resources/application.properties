server.port=8080
spring.application.name=agent-platform-backend

# Basic MySQL Datasource Configuration (to be filled later)
spring.datasource.url=jdbc:mysql://localhost:3306/agent_platform_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Properties (MyBatis will override some of this later)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
